  <body>
    <!-- Apply the saved theme before React paints, so there is no flash of the wrong one. -->
    <script>
      try {
        var saved = localStorage.getItem("theme");
        if (saved && saved !== "system") document.body.setAttribute("data-mode", saved);
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
